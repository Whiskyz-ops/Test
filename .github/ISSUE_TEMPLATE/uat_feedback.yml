name: "UAT — Feedback / suggestion"
description: Share an assessment, suggestion, or friction point that isn't a clear bug.
title: "[UAT feedback] "
labels: ["uat", "feedback"]
body:
  - type: input
    id: participant
    attributes:
      label: Participant ID
      placeholder: priya-01
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type of feedback
      options:
        - Usability / clarity
        - Missing capability
        - Trust / correctness concern
        - Performance
        - Praise (what worked well)
        - Other
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Your feedback
      description: What happened, why it matters, and what you'd want instead.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: How much did this affect you?
      options:
        - Blocked me
        - Slowed me down
        - Minor annoyance
        - Just an idea
