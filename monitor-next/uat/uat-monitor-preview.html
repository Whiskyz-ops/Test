<style>
  /* ── WISING Monitor — UAT preview. Honors monitor-next tokens (dark ops console). ── */
  #wising, #wising * { box-sizing: border-box; }
  #wising {
    --ink:#08080a; --panel:#111114; --panel2:#17171b; --line:rgba(255,255,255,.08);
    --gold:#D4AF37; --cyan:#06B6D4;
    --exposed:#ef4444; --approaching:#f59e0b; --nexus:#a855f7; --none:#52525b;
    --mapBase:#1d1d21; --mapStroke:#0a0a0c;
    --t1:rgba(255,255,255,.92); --t2:rgba(255,255,255,.55); --t3:rgba(255,255,255,.38);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--ink); color: var(--t1);
    min-height: 100vh; display: flex; -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  #wising .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* sidebar */
  #wising aside {
    width: 232px; flex-shrink: 0; align-self: stretch; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
  }
  #wising .logo { display:flex; align-items:center; gap:12px; padding:20px; border-bottom:1px solid var(--line); }
  #wising .mark { width:36px; height:36px; border-radius:11px; background:linear-gradient(135deg,var(--gold),var(--cyan));
    color:#000; font-weight:900; display:flex; align-items:center; justify-content:center; font-size:18px; }
  #wising .brand { font-weight:800; letter-spacing:.06em; line-height:1; }
  #wising .brand small { display:block; font-size:9px; letter-spacing:.22em; color:var(--t3); margin-top:4px; text-transform:uppercase; font-weight:700; }
  #wising nav { flex:1; padding:14px 12px; display:flex; flex-direction:column; gap:3px; }
  #wising .nav-i { display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:11px; font-size:13px;
    font-weight:600; color:var(--t2); text-decoration:none; cursor:default; }
  #wising .nav-i .ico { width:18px; text-align:center; opacity:.85; }
  #wising .nav-i.on { background:rgba(255,255,255,.09); color:#fff; }
  #wising .nav-i.on::after { content:""; margin-left:auto; width:6px; height:6px; border-radius:50%; background:var(--cyan); }
  #wising .foot { padding:12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:2px; }
  #wising .foot a { display:flex; align-items:center; gap:12px; padding:7px 12px; border-radius:9px; font-size:12px;
    color:var(--t3); text-decoration:none; cursor:default; }
  #wising .foot a .ico { width:18px; text-align:center; }
  #wising .ucard { margin-top:8px; display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:12px;
    background:rgba(255,255,255,.05); border:1px solid var(--line); }
  #wising .uav { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--cyan),var(--gold));
    color:#000; font-weight:900; font-size:11px; display:flex; align-items:center; justify-content:center; }
  #wising .uname { font-size:12px; font-weight:700; }
  #wising .uco { font-size:10px; color:var(--t3); }

  /* main */
  #wising main { flex:1; min-width:0; padding:22px clamp(16px,3vw,34px) 40px; }
  #wising .head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
  #wising h1 { font-size:30px; font-weight:800; letter-spacing:-.01em; margin:0; }
  #wising .sub { color:var(--t2); font-size:13px; margin-top:5px; }
  #wising .headr { display:flex; align-items:center; gap:10px; }
  #wising .uat-badge { font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--gold);
    border:1px solid rgba(212,175,55,.4); background:rgba(212,175,55,.08); padding:6px 10px; border-radius:8px; }
  #wising select { appearance:none; background:var(--panel2); border:1px solid var(--line); color:var(--t1);
    border-radius:11px; padding:10px 34px 10px 14px; font-size:13px; font-weight:600; cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7'><path d='M1 1l4 4 4-4' stroke='rgba(255,255,255,.4)' stroke-width='1.5' fill='none'/></svg>");
    background-repeat:no-repeat; background-position:right 13px center; }
  #wising select:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }

  #wising .sources { display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-bottom:16px; font-size:11px; color:var(--t2); }
  #wising .dot { width:8px; height:8px; border-radius:50%; background:#22c55e; display:inline-block; margin-right:7px; }
  #wising .src-mut { color:var(--t3); }

  #wising .alerts { margin-bottom:20px; border:1px solid rgba(245,158,11,.32); background:rgba(245,158,11,.09);
    border-radius:14px; padding:13px 15px; }
  #wising .alerts h4 { margin:0 0 6px; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--approaching); font-weight:800; }
  #wising .alerts li { list-style:none; font-size:12px; color:rgba(255,255,255,.72); padding:1px 0; }
  #wising .alerts ul { margin:0; padding:0; }

  #wising .panel { border:1px solid var(--line); background:var(--panel); border-radius:18px; padding:16px; margin-bottom:24px; }
  #wising .maprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  #wising .back { padding:7px 12px; font-size:11px; font-weight:700; border-radius:9px; background:rgba(255,255,255,.05);
    border:1px solid var(--line); color:var(--t2); cursor:pointer; }
  #wising .back:hover { background:rgba(255,255,255,.1); color:#fff; }
  #wising .maptag { font-size:11px; color:var(--t3); }
  #wising svg.map { width:100%; height:auto; display:block; }
  #wising svg.map path { stroke:var(--mapStroke); stroke-width:.4; outline:none; }
  #wising svg.map path.click { cursor:pointer; }
  #wising svg.map path.click:hover { filter:brightness(1.18); }
  #wising .legend { display:flex; flex-wrap:wrap; gap:16px; margin-top:12px; padding:0 2px; }
  #wising .legend span { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--t2); }
  #wising .sw { width:12px; height:12px; border-radius:3px; }
  #wising .tip { font-size:11px; color:var(--t3); margin-top:8px; }

  #wising .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px; }
  @media(max-width:820px){ #wising .kpis { grid-template-columns:repeat(2,1fr); } }
  #wising .kpi { text-align:left; border:1px solid var(--line); background:var(--panel); border-radius:16px; padding:15px;
    cursor:pointer; transition:transform .12s, border-color .12s, background .12s; color:inherit; font:inherit; }
  #wising .kpi:hover { transform:translateY(-2px); border-color:rgba(255,255,255,.2); }
  #wising .kpi.on { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.28); box-shadow:0 8px 24px rgba(0,0,0,.35); }
  #wising .kpi:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
  #wising .kpi .kh { display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  #wising .kpi .kh .kd { width:10px; height:10px; border-radius:50%; }
  #wising .kpi .kt { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--t2); font-weight:800; }
  #wising .kpi .kn { font-size:32px; font-weight:800; line-height:1; }
  #wising .kpi .kdesc { font-size:11px; color:var(--t3); margin-top:7px; line-height:1.35; }
  #wising .kpi .kliab { font-size:11px; color:var(--t2); margin-top:8px; }

  #wising .tablewrap { border:1px solid var(--line); background:var(--panel); border-radius:18px; overflow-x:auto; }
  #wising table { width:100%; border-collapse:collapse; min-width:640px; }
  #wising thead { background:rgba(255,255,255,.02); }
  #wising th { padding:11px 16px; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--t3);
    font-weight:800; text-align:left; }
  #wising th.r, #wising td.r { text-align:right; }
  #wising td { padding:13px 16px; font-size:13px; border-top:1px solid var(--line); vertical-align:middle; }
  #wising tbody tr:hover { background:rgba(255,255,255,.03); }
  #wising .reg { display:flex; align-items:center; gap:9px; font-weight:600; }
  #wising .flag { font-size:17px; }
  #wising .abbr { font-size:10px; font-weight:900; background:rgba(255,255,255,.1); border-radius:5px; padding:2px 6px; }
  #wising .badge { padding:3px 9px; border-radius:7px; font-size:10px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; }
  #wising .sub2 { font-size:10px; color:var(--t3); margin-top:2px; }
  #wising .yes { color:var(--cyan); font-weight:700; }
  #wising .no { color:var(--t3); }
  #wising .track { width:172px; }
  #wising .track .tt { display:flex; justify-content:space-between; font-size:10px; margin-bottom:5px; }
  #wising .track .bar { height:8px; border-radius:99px; background:rgba(255,255,255,.1); overflow:hidden; }
  #wising .track .fill { height:100%; border-radius:99px; }
  #wising .empty { text-align:center; color:var(--t3); font-size:13px; padding:38px; }
</style>

<div id="wising">
  <aside>
    <div class="logo">
      <div class="mark">W</div>
      <div class="brand">WISING<small>Exposure Monitor</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="foot">
      <a><span class="ico">🪪</span>Personal details</a>
      <a><span class="ico">⚙️</span>Account settings</a>
      <a><span class="ico">📚</span>Knowledge base</a>
      <div class="ucard">
        <div class="uav">AS</div>
        <div><div class="uname">Aarav Sharma</div><div class="uco">Wising Inc.</div></div>
      </div>
    </div>
  </aside>

  <main>
    <div class="head">
      <div>
        <h1>Monitor</h1>
        <div class="sub">Keep track of your cross-border tax exposure around the world.</div>
      </div>
      <div class="headr">
        <span class="uat-badge">UAT · demo data</span>
        <select id="scope"></select>
      </div>
    </div>

    <div class="sources">
      <span><span class="dot"></span>Plaid · Bank / brokerage feed</span>
      <span><span class="dot"></span>Travel log · Immigration / day-count</span>
      <span class="src-mut">synced daily · last sync 30 Jun 2026</span>
    </div>

    <div id="alerts"></div>

    <section class="panel">
      <div class="maprow">
        <div id="mapback"></div>
        <span class="maptag" id="maptag"></span>
      </div>
      <div id="map"></div>
      <div class="legend" id="legend"></div>
      <div class="tip" id="tip"></div>
    </section>

    <div class="kpis" id="kpis"></div>
    <div class="tablewrap" id="tablewrap"></div>
  </main>
</div>

    } else if(category==="approaching"){
      head = th(["Jurisdiction","Tracker","Reporting ($)","Presence (days)","Tax Resident"]);
      rowFn = function(r){
        var p = Math.min(100, Math.round(pct(r)*100)); var over=p>=60; var col=over?"#f59e0b":"#22c55e";
        var track = '<div class="track"><div class="tt"><span style="color:var(--t2)">'+p+'% to residency / limit</span>'+(over?'<span style="color:var(--approaching);font-weight:700">⚠ alert</span>':'')+'</div><div class="bar"><div class="fill" style="width:'+p+'%;background:'+col+'"></div></div></div>';
        var rep = '<div class="mono"><span style="color:var(--t1)">'+usd(r.report.reportedUsd)+'</span> <span style="color:var(--t3)">/ '+usd(r.report.limitUsd)+'</span></div><div class="sub2">'+esc(r.report.metric)+'</div>';
        var days = '<div class="mono"><span style="color:var(--t1)">'+r.report.days+'</span> <span style="color:var(--t3)">/ '+r.report.dayThreshold+'</span></div><div class="sub2">'+esc(r.report.test)+'</div>';
        return td([regionCell(r), track, rep, days, yesno(r.resident)]);
      };
    } else if(category==="nexus"){
      head = th(["Jurisdiction","Trigger Date",["Income in Scope",1],"Reporting owed","Tax Resident"]);
      rowFn = function(r){ return td([regionCell(r), (r.triggerDate||"—"), ['<span class="mono">'+usd(r.incomeInScopeUsd)+'</span>',1],
        '<span style="color:var(--nexus);font-weight:600">'+esc(r.report.metric)+'</span>', yesno(r.resident)]); };
    } else {
      head = th(["Jurisdiction","Status",["Est. Liability",1],["Income in Scope",1],"Tax Resident"]);
      rowFn = function(r){ return td([regionCell(r), badge(r.status), [(r.estimatedLiabilityUsd?'<span class="mono">'+usd(r.estimatedLiabilityUsd)+'</span>':"—"),1],
        ['<span class="mono">'+usd(r.incomeInScopeUsd)+'</span>',1], yesno(r.resident)]); };
    }
    document.getElementById("tablewrap").innerHTML = '<table><thead>'+head+'</thead><tbody>'+list.map(rowFn).join("")+'</tbody></table>';
  }
  function th(cols){ return "<tr>"+cols.map(function(c){ var r=Array.isArray(c); return '<th'+(r?' class="r"':"")+'>'+(r?c[0]:c)+'</th>'; }).join("")+"</tr>"; }
  function td(cols){ return "<tr>"+cols.map(function(c){ var r=Array.isArray(c); return '<td'+(r?' class="r"':"")+'>'+(r?c[0]:c)+'</td>'; }).join("")+"</tr>"; }

  renderStatic();
  render();
})();
</script>
